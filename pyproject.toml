[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vk-eios-schedule-bot"
version = "0.1.0"
description = "VK-бот для просмотра расписания Костромского государственного университета (ЭИОС КГУ)"
requires-python = ">=3.11"
dependencies = [
    "vkbottle>=4.3,<5",
    "httpx[socks]>=0.27,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sentry-sdk>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
]
migrations = [
    "asyncpg>=0.29,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv", "venv", "data"]

[tool.ruff.lint]
# Базовый набор: ошибки синтаксиса/импортов и неиспользуемый код.
select = ["E4", "E7", "E9", "F"]
