name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd ~/app
            # Сервер — только копия main: локальные правки не должны
            # оставлять контейнер на старом коде.
            git fetch origin main
            git reset --hard origin/main
            # --build обязателен: иначе контейнер продолжит работать
            # со старым образом (например, с кодом времён PostgreSQL).
            docker compose up -d --build --remove-orphans
            docker compose ps
            docker image prune -f
