services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Единый файл SQLite с профилями, черновиками и расписанием.
      SQLITE_DB_PATH: /app/data/bot.db
    volumes:
      - bot_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
